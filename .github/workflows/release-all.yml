name: 一键发布 Mac 和 Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"

concurrency:
  group: crosscopy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS 通用版
    runs-on: macos-14
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 检查更新签名密钥
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::请先在仓库 Actions secrets 中配置 TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: 打包 macOS Intel 和 Apple Silicon 通用应用
        run: >-
          npm run build --
          --target universal-apple-darwin
          --bundles app
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 固定应用身份并重新签名更新包
        run: |
          chmod +x scripts/sign-macos-app.sh
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/CrossCopy.app"
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          VERSION="$(node -p "require('./package.json').version")"
          UPDATE_ARCHIVE="$BUNDLE_DIR/CrossCopy_${VERSION}_universal.app.tar.gz"

          scripts/sign-macos-app.sh "$APP_PATH"
          find "$BUNDLE_DIR" -maxdepth 1 \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -delete
          COPYFILE_DISABLE=1 tar -czf "$UPDATE_ARCHIVE" -C "$BUNDLE_DIR" CrossCopy.app
          npx tauri signer sign --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$UPDATE_ARCHIVE"

      - name: 生成 DMG
        run: |
          mkdir -p src-tauri/target/universal-apple-darwin/release/bundle/dmg
          hdiutil create \
            -volname CrossCopy \
            -srcfolder src-tauri/target/universal-apple-darwin/release/bundle/macos/CrossCopy.app \
            -ov \
            -format UDZO \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/CrossCopy_Universal.dmg

      - name: 整理发布文件
        run: |
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz release-assets/
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig release-assets/

      - name: 上传 macOS 发布文件
        uses: actions/upload-artifact@v4
        with:
          name: CrossCopy-macOS-Universal
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows:
    name: Windows 64 位
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 检查更新签名密钥
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "请先在仓库 Actions secrets 中配置 TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }

      - name: 打包 Windows EXE 和 MSI 安装包
        run: npm run build

      - name: 整理发布文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe.sig release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/

      - name: 上传 Windows 发布文件
        uses: actions/upload-artifact@v4
        with:
          name: CrossCopy-Windows-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: 发布并生成应用内更新清单
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载全部发布文件
        uses: actions/download-artifact@v4
        with:
          pattern: CrossCopy-*
          path: release-assets
          merge-multiple: true

      - name: 生成 latest.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/generate-update-manifest.mjs \
            release-assets \
            "$VERSION" \
            "${{ github.repository }}" \
            "v$VERSION"

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "${{ github.sha }}" \
              --title "CrossCopy $TAG" \
              --generate-notes \
              --latest
          fi
